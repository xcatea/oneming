name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate patched lockfile candidate
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - run: npm ci
      - name: Report npm audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module -e "import fs from 'node:fs'; const a = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8')); console.log('AUDIT SUMMARY', JSON.stringify(a.metadata?.vulnerabilities || {})); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log('AUDIT PACKAGE', name, JSON.stringify({severity:v.severity, direct:v.isDirect, range:v.range, fixAvailable:v.fixAvailable, via:v.via}));"
      - uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock
          path: package-lock.json
          if-no-files-found: error
      - run: npm test
      - run: npm run build
